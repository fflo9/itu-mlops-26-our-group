name: Run Dagger pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dagger:
    name: Run Dagger pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code                        #copies your repo onto the runner
        uses: actions/checkout@v7.0.1

      - name: Set up Go                            #installs Go so your pipeline code can run
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.1
          cache: false

      - name: Run Dagger pipeline                  #installs the Dagger CLI and run pipeline.go (the dagger pipeline)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          workdir: dagger
          verb: run
          args: go run pipeline.go
          version: "0.21.10"

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: model
          path: model/

  validate:
    name: Validate Model
    needs: dagger
    runs-on: ubuntu-latest

    steps:
      - name: Download Model Artifact
        uses: actions/download-artifact@v5
        with:
          name: model
          path: model/

      - name: Run Model Inference Test Action
        uses: lasselundstenjensen/itu-sdse-project-model-validator@main


  deploy:
    name: Deploy Model
    needs: validate
    runs-on: ubuntu-latest

